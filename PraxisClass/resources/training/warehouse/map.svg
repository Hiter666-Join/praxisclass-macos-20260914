<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="固定四点教学地图；三份条件独立使用"><title>固定四点教学地图；三份条件独立使用</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7Z" fill="context-stroke"/></marker></defs><rect width="1200" height="570" fill="#EEF3EF"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="26" y="44" font-size="30" fill="#173B38" font-weight="700">先核对条件，再选访问顺序</text><text x="26" y="78" font-size="18" fill="#24433E" font-weight="400">WAREHOUSE-4P 1.0｜每格距离与耗时均为1｜起终点D，A/B/C各办理一次</text><rect x="32" y="114" width="780" height="362" rx="14" fill="#FFFFFF" stroke="#CCD7D1"/><line x1="110" y1="210" x2="110" y2="365" stroke="#CBD6D0" stroke-width="2"/><line x1="265" y1="210" x2="265" y2="365" stroke="#CBD6D0" stroke-width="2"/><line x1="420" y1="210" x2="420" y2="365" stroke="#CBD6D0" stroke-width="2"/><line x1="575" y1="210" x2="575" y2="365" stroke="#CBD6D0" stroke-width="2"/><line x1="730" y1="210" x2="730" y2="365" stroke="#CBD6D0" stroke-width="2"/><line x1="110" y1="365" x2="730" y2="365" stroke="#CBD6D0" stroke-width="2"/><line x1="110" y1="210" x2="730" y2="210" stroke="#CBD6D0" stroke-width="2"/><g data-point-id="D" data-x="0" data-y="0"><circle cx="110" cy="365" r="9" fill="#FFF" stroke="#214D43" stroke-width="2"/><text x="95" y="396" font-size="20" fill="#173B38" font-weight="700">D (0,0)</text></g><g data-point-id="A" data-x="4" data-y="0"><circle cx="730" cy="365" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="715" y="396" font-size="20" fill="#173B38" font-weight="700">A (4,0)</text></g><g data-point-id="B" data-x="0" data-y="1"><circle cx="110" cy="210" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="95" y="190" font-size="20" fill="#173B38" font-weight="700">B (0,1)</text></g><g data-point-id="C" data-x="1" data-y="1"><circle cx="265" cy="210" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="250" y="190" font-size="20" fill="#173B38" font-weight="700">C (1,1)</text></g><text x="77" y="183" font-size="16" fill="#24433E" font-weight="400">y</text><text x="748" y="432" font-size="16" fill="#24433E" font-weight="400">x</text><text x="105" y="446" font-size="16" fill="#60786E" font-weight="400">0</text><text x="260" y="446" font-size="16" fill="#60786E" font-weight="400">1</text><text x="415" y="446" font-size="16" fill="#60786E" font-weight="400">2</text><text x="570" y="446" font-size="16" fill="#60786E" font-weight="400">3</text><text x="725" y="446" font-size="16" fill="#60786E" font-weight="400">4</text><text x="58" y="216" font-size="16" fill="#60786E" font-weight="400">1</text><text x="58" y="371" font-size="16" fill="#60786E" font-weight="400">0</text><rect x="842" y="114" width="328" height="362" rx="14" fill="#FFFFFF" stroke="#CCD7D1"/><text x="864" y="155" font-size="22" fill="#173B38" font-weight="700">三份条件分别使用</text><text x="864" y="204" font-size="22" fill="#245F4D" font-weight="700">基础：A不晚于4</text><text x="864" y="262" font-size="22" fill="#245F4D" font-weight="700">必要迁移：B不晚于1</text><text x="864" y="291" font-size="17" fill="#24433E" font-weight="400">同时取消A的时限</text><text x="864" y="349" font-size="22" fill="#6E552D" font-weight="700">可选进阶：A不晚于3</text><text x="864" y="378" font-size="17" fill="#24433E" font-weight="400">不叠加迁移中的B时限</text><text x="864" y="436" font-size="17" fill="#24433E" font-weight="400">无等待、无装卸及办理耗时</text><text x="26" y="515" font-size="19" fill="#24433E" font-weight="400">路径约定：每段先横向、再纵向；只在计划站点办理，途经不自动办理。</text><text x="26" y="545" font-size="16" fill="#60786E" font-weight="400">AI辅助自制教学地图；坐标、距离和时间均为教学设定，不代表真实仓库或设备。</text></g></svg>
