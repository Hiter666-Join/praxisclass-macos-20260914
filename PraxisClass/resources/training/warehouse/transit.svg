<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="550" viewBox="0 0 1380 550" role="img" aria-label="途经地点与计划办理的区别"><title>途经地点与计划办理的区别</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7Z" fill="context-stroke"/></marker></defs><rect width="1380" height="550" fill="#EEF3EF"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="26" y="44" font-size="30" fill="#173B38" font-weight="700">经过一个点，不等于完成该点任务</text><text x="26" y="78" font-size="18" fill="#24433E" font-weight="400">三段局部路径示意；箭头按先横向、再纵向绘制，未改变任务契约</text><g transform="translate(18 0)" data-segment-from="A" data-segment-to="B"><rect x="0" y="111" width="440" height="375" rx="14" fill="#FFFFFF" stroke="#CCD7D1"/><text x="22" y="152" font-size="26" fill="#173B38" font-weight="700">A → B</text><line x1="54" y1="222" x2="54" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="134" y1="222" x2="134" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="214" y1="222" x2="214" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="294" y1="222" x2="294" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="374" y1="222" x2="374" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="54" y1="302" x2="374" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="54" y1="222" x2="374" y2="222" stroke="#CBD6D0" stroke-width="2"/><polyline data-world-path="4,0;3,0;2,0;1,0;0,0;0,1" points="374,302 294,302 214,302 134,302 54,302 54,222" fill="none" stroke="#286658" stroke-width="5" stroke-linejoin="round"  marker-end="url(#arrow)"/><g ><circle cx="54" cy="302" r="9" fill="#FFF" stroke="#214D43" stroke-width="2"/><text x="39" y="333" font-size="18" fill="#173B38" font-weight="700">D</text></g><g ><circle cx="374" cy="302" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="359" y="333" font-size="18" fill="#173B38" font-weight="700">A</text></g><g ><circle cx="54" cy="222" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="39" y="202" font-size="18" fill="#173B38" font-weight="700">B</text></g><g ><circle cx="134" cy="222" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="119" y="202" font-size="18" fill="#173B38" font-weight="700">C</text></g><text x="22" y="377" font-size="20" fill="#8A4B26" font-weight="700">途经D，不结束路线</text><text x="22" y="417" font-size="16" fill="#24433E" font-weight="400">A(4,0) → D(0,0) → B(0,1)</text><text x="22" y="448" font-size="16" fill="#24433E" font-weight="400">只有到达本段计划终点B才办理B。</text></g><g transform="translate(476 0)" data-segment-from="C" data-segment-to="D"><rect x="0" y="111" width="440" height="375" rx="14" fill="#FFFFFF" stroke="#CCD7D1"/><text x="22" y="152" font-size="26" fill="#173B38" font-weight="700">C → D</text><line x1="54" y1="222" x2="54" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="134" y1="222" x2="134" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="214" y1="222" x2="214" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="294" y1="222" x2="294" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="374" y1="222" x2="374" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="54" y1="302" x2="374" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="54" y1="222" x2="374" y2="222" stroke="#CBD6D0" stroke-width="2"/><polyline data-world-path="1,1;0,1;0,0" points="134,222 54,222 54,302" fill="none" stroke="#286658" stroke-width="5" stroke-linejoin="round"  marker-end="url(#arrow)"/><g ><circle cx="54" cy="302" r="9" fill="#FFF" stroke="#214D43" stroke-width="2"/><text x="39" y="333" font-size="18" fill="#173B38" font-weight="700">D</text></g><g ><circle cx="374" cy="302" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="359" y="333" font-size="18" fill="#173B38" font-weight="700">A</text></g><g ><circle cx="54" cy="222" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="39" y="202" font-size="18" fill="#173B38" font-weight="700">B</text></g><g ><circle cx="134" cy="222" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="119" y="202" font-size="18" fill="#173B38" font-weight="700">C</text></g><text x="22" y="377" font-size="20" fill="#8A4B26" font-weight="700">途经B，不补办B任务</text><text x="22" y="417" font-size="16" fill="#24433E" font-weight="400">C(1,1) → B(0,1) → D(0,0)</text><text x="22" y="448" font-size="16" fill="#24433E" font-weight="400">仅当此段为最后返程，才结束路线。</text></g><g transform="translate(934 0)" data-segment-from="B" data-segment-to="A"><rect x="0" y="111" width="440" height="375" rx="14" fill="#FFFFFF" stroke="#CCD7D1"/><text x="22" y="152" font-size="26" fill="#173B38" font-weight="700">B → A</text><line x1="54" y1="222" x2="54" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="134" y1="222" x2="134" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="214" y1="222" x2="214" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="294" y1="222" x2="294" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="374" y1="222" x2="374" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="54" y1="302" x2="374" y2="302" stroke="#CBD6D0" stroke-width="2"/><line x1="54" y1="222" x2="374" y2="222" stroke="#CBD6D0" stroke-width="2"/><polyline data-world-path="0,1;1,1;2,1;3,1;4,1;4,0" points="54,222 134,222 214,222 294,222 374,222 374,302" fill="none" stroke="#286658" stroke-width="5" stroke-linejoin="round"  marker-end="url(#arrow)"/><g ><circle cx="54" cy="302" r="9" fill="#FFF" stroke="#214D43" stroke-width="2"/><text x="39" y="333" font-size="18" fill="#173B38" font-weight="700">D</text></g><g ><circle cx="374" cy="302" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="359" y="333" font-size="18" fill="#173B38" font-weight="700">A</text></g><g ><circle cx="54" cy="222" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="39" y="202" font-size="18" fill="#173B38" font-weight="700">B</text></g><g ><circle cx="134" cy="222" r="9" fill="#296253" stroke="#214D43" stroke-width="2"/><text x="119" y="202" font-size="18" fill="#173B38" font-weight="700">C</text></g><text x="22" y="377" font-size="20" fill="#8A4B26" font-weight="700">途经C，仍需稍后按计划办理</text><text x="22" y="417" font-size="16" fill="#24433E" font-weight="400">先经C到(4,1)，再纵向到A(4,0)。</text><text x="22" y="448" font-size="16" fill="#24433E" font-weight="400">不能将C的办理时刻改为路过时刻。</text></g><text x="26" y="528" font-size="17" fill="#60786E" font-weight="400">AI辅助教学示意；办理只发生在访问序列规定的终点。暂停、倍速和重放不改变教学时间。</text></g></svg>
